services:

  postgres:
    image: postgres:16
    container_name: qa-sql-lab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: qa_lab
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qa-sql-lab-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@qa.user
      PGADMIN_DEFAULT_PASSWORD: qa_password

    ports:
      - "5050:80"

    volumes:
      - ./servers.json:/pgadmin4/servers.json:ro
      - ./pgpass:/pgpass:ro

    depends_on:
      - postgres


  python-runner:
    build:
      context: ./scripts
      dockerfile: Dockerfile

    container_name: qa-sql-lab-python-runner

    profiles:
      - tools

    environment:
      DB_HOST: postgres
      DB_NAME: qa_lab
      PGUSER: qa_user

    volumes:
      - ./pgpass:/root/.pgpass:ro
      - ./scripts:/app

    depends_on:
      - postgres


volumes:
  postgres_data:
